[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assignment-tracker"
version = "2.0.0"
description = "Homework Tracker v2 (Google Sheets + Vercel Web UI + Rotated Fridge Printout)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
printout = "main:printout_cli"
seed = "main:seed_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]
py-modules = ["main"]
