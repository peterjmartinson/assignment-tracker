[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assignment-tracker"
version = "0.1.0"
description = "Two-list homework tracker and Trello sync engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
pull = "main:pull_cli"
push = "main:push_cli"
validate = "main:validate_cli"
ingest = "main:ingest_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]
py-modules = ["main"]
