board_id: "6a0dd7e64e205c4e01db1b21"

# Map kid names to Trello List IDs
lists:
  Isaac: "6a0dd7fc14b166b8906b1202"
  Asher: "6a0dd7f189ae4d6d94e4332e"

# Gmail IMAP Configuration for automated server polling
gmail:
  host: "imap.gmail.com"
  port: 993
  mark_as_read: true
  # Optional: Move to a processed label if you create it in Gmail
  # processed_label: "Classroom/Processed"

# Action Type Allowlist (only actionable task notifications are ingested; drops announcements and newsletters)
allowed_actions:
  - "New assignment"
  - "Due tomorrow"
  - "Due soon"
  - "New question"

# Pre-defined profiles for your boys with class keyword sentinels
profiles:
  Isaac:
    gmail_label: "Classroom/Isaac"
    email_patterns:
      - "isaac.martinson@mainlineclassical.org"
      - "isaac"
    classes:
      - name: "Math"
        label: "Math"
        keywords: ["math", "beast", "bao", "alcumus", "arithmetic", "algebra", "fractions", "division", "multiplication"]
      - name: "French"
        label: "French"
        keywords: ["french", "français", "vocab", "revanche", "monte cristo"]
      - name: "Physics"
        label: "Physics"
        keywords: ["physics", "science", "lab", "experiment"]
      - name: "Art History"
        label: "Art History"
        keywords: ["art history", "art"]
      - name: "English Literature"
        label: "Eng Lit"
        keywords: ["eng lit", "english", "literature", "essay", "draft", "reading", "ch."]
      - name: "Latin"
        label: "Latin"
        keywords: ["latin", "lingua"]

  Asher:
    gmail_label: "Classroom/Asher"
    email_patterns:
      - "asher.martinson@mainlineclassical.org"
      - "asher"
    classes:
      - name: "Math"
        label: "Math"
        keywords: ["math", "beast", "bao", "kangaroo", "greg tang", "addition", "subtraction", "counting", "number line", "grouping"]
      - name: "Art History"
        label: "Art History"
        keywords: ["art history", "art"]
      - name: "Reading"
        label: "Reading"
        keywords: ["reading", "read", "phonics", "english"]

# Global fallback formatting rules (used if general keyword matches)
class_rules:
  - match: "(?i)art\\s*history"
    prefix: "[Art History]"
  - match: "(?i)french"
    prefix: "[French]"
  - match: "(?i)physics|science"
    prefix: "[Physics]"
  - match: "(?i)beast\\s*academy|bao"
    prefix: "[BAO]"
  - match: "(?i)math|arithmetic"
    prefix: "[Math]"
  - match: "(?i)eng\\s*lit|english|literature"
    prefix: "[Eng Lit]"
  - match: "(?i)alcumus"
    prefix: "[Alcumus]"
