board_id: "6a0dd7e64e205c4e01db1b21"

# Map kid names to Trello List IDs
lists:
  Isaac: "6aadba784431fba8472396f0"
  Asher: "6aadba75f7abaaaf39a7d2c6"

# Gmail IMAP Configuration for automated server polling
gmail:
  host: "imap.gmail.com"
  port: 993
  mark_as_read: true
  # Optional: Move to a processed label if you create it in Gmail
  # processed_label: "Classroom/Processed"

# Action Type Allowlist (only actionable task notifications are ingested; drops announcements and newsletters)
allowed_actions:
  - "New assignment"
  - "Due tomorrow"
  - "Due soon"
  - "New question"

# Kid profile definitions for incoming email routing
profiles:
  Isaac:
    gmail_label: "Classroom/Isaac"
    email_patterns:
      - "isaac.martinson@mainlineclassical.org"
      - "isaac"

  Asher:
    gmail_label: "Classroom/Asher"
    email_patterns:
      - "asher.martinson@mainlineclassical.org"
      - "asher"

# Unified, distinct classes and keyword sentinels (shared across all kids)
# Note: More specific subjects are listed before general ones (e.g. Art History before Art)
classes:
