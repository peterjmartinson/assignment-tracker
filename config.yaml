# Global fallback regex rules
class_rules:
  - match: "(?i)art\\s*history"
    prefix: "[Art History]"
  - match: "(?i)french"
    prefix: "[French]"
  - match: "(?i)latin"
    prefix: "[Latin]"
  - match: "(?i)hebrew"
    prefix: "[Hebrew]"
  - match: "(?i)physics|chemistry|biology|science"
    prefix: "[Science]"
  - match: "(?i)beast\\s*academy|bao|math"
    prefix: "[Math]"
  - match: "(?i)eng\\s*lit|literature"
    prefix: "[Eng Lit]"
  - match: "(?i)grammar|spelling|vocab"
    prefix: "[Eng Lang]"
  - match: "(?i)debate"
    prefix: "[Debate]"
  - match: "(?i)robotics"
    prefix: "[Robotics]"
