name: Peter Martinson
email: peter.j.martinson@gmail.com
destination: print

# ── Shared Subscriber Location ──────────────────────────────────────────────
location:
  name: "Bryn Mawr, PA"
  lat: 40.02
  lon: -75.34

# ── Requested Screamsheets ──────────────────────────────────────────────────
sheets:

  mlb:
    teams: ["Milwaukee Brewers", "Cincinnati Reds", "Arizona Diamondbacks"]
    mad_fan: false

  mlb_news:
    teams: ["Milwaukee Brewers", "Cincinnati Reds", "Arizona Diamondbacks"]

  presidential: true

  sky_tonight:
    people:
      - name: "Pisces"
        horoscope_style: "playbook"
        birth_date: "1978-02-26"
        birth_time: "01:20"
        birth_location: "Wauwatosa, WI"
      - name: "Virgo"
        horoscope_style: "kepler"
        birth_date: "1981-08-26"
        birth_time: "13:26"
        birth_location: "New York, NY"

  nfl:
    favorite_teams:
      - id: 21
        name: "Philadelphia Eagles"
      - id: 25
        name: "Green Bay Packers"

  morning_briefing:
    api_url: "https://random-task-rouge.vercel.app/api/agenda"
    important_senders:
      - "annashavin@gmail.com"
      - "mainlineclassical.org"
      - "michelemrice@gmail.com"
      - "vscottzelov@lowermerion.org"
      - "asenn@theredeemer.org"
    payload:
      max_tasks: 15
      output_directory: "./output"
      default_start_location: "1041 Reese Ave., Bryn Mawr, PA 19010"
      calendars:
        ical_urls:
          - name: "Personal"
            url: ${CALENDAR_URL_PERSONAL}
          - name: "Family"
            url: ${CALENDAR_URL_FAMILY}
          - name: "Geckos (Asher)"
            url: ${CALENDAR_URL_GECKOS}
          - name: "Tigers (Isaac)"
            url: ${CALENDAR_URL_TIGERS}
          - name: "Prime (Asher)"
            url: ${CALENDAR_URL_PRIME}
          - name: "Brawlers"
            url: ${CALENDAR_URL_BRAWLERS}
      google_calendar:
        client_id: ${GOOGLE_CALENDAR_CLIENT_ID}
        client_secret: ${GOOGLE_CALENDAR_CLIENT_SECRET}
        refresh_token: ${GOOGLE_CALENDAR_REFRESH_TOKEN}
        calendar_ids:
          - ${GOOGLE_CALENDAR_ID_MLCA}
      trello:
        api_key: ${TRELLO_API_KEY}
        token: ${TRELLO_TOKEN}
        boards:
          - name: "Homework"
            board_id: ${TRELLO_BOARD_ID_HOMEWORK}
            lists:
              - id: ${TRELLO_LIST_ID_ISAAC}
                name: "Isaac"
                assignee: "Isaac"
                max_tasks: 15
              - id: ${TRELLO_LIST_ID_ASHER}
                name: "Asher"
                assignee: "Asher"
                max_tasks: 15
        include_past_due: true
      maps:
        enabled: true
        api_key: ${GOOGLE_MAPS_API_KEY}
